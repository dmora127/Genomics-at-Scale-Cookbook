# Expands the short author form in page frontmatter (`- id: <contributor>` plus `roles:`) into the full inline
# author objects MyST needs, using authors.yml, and commits the result back to main. Authors commit the short
# form; the history still ends up with the expanded form. It then tells the hub to sync, so the hub only ever
# picks up the expanded commit. This replaces notify-hub.yml.
#
# A push made with the built-in GITHUB_TOKEN starts no other workflows, but none is needed: build.yml and
# deploy-pages.yml expand the pages in their own working copy before building, so the runs started by the
# human's push already render the expanded authors.
#
# The script exits non-zero when authors.yml itself is wrong (a duplicated or invalid ORCID, an undefined
# affiliation id); nothing is committed and the hub is not told until that is fixed.
#
# Needs the repository secret HUB_DISPATCH_TOKEN: a fine-grained personal access token with Contents read and
# write on the hub repository (the built-in token cannot send events to another repository).

name: Expand page authors
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: expand-page-authors
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml

      - name: Expand page authors and commit the result
        run: |
          python3 .github/scripts/sync-page-authors.py
          if git diff --quiet; then
            echo "Every page already carries the expanded form."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Expand page authors from authors.yml"
          git push

      - name: Tell the hub to sync
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: gh api repos/dmora127/chtc-biocafe-cookbook/dispatches -f event_type=cookbook-updated
