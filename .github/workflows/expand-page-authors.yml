# Keeps the derived author and citation data in this repository in step with authors.yml and CITATION.cff and
# commits the result back to main, then tells the hub to sync so the hub only ever picks up the synced commit.
# This replaces notify-hub.yml.
#
#  1. Page frontmatter: expands the short author form (`- id: <contributor>` plus `roles:`) into the full inline
#     author objects MyST needs, using authors.yml. Authors commit the short form; the history still ends up with
#     the expanded form.
#  2. CITATION.cff: rewrites its `authors:` list to the people credited on the pages, so adding a chapter with a
#     new author adds them to the citation and removing a person's last chapter removes them. The order follows
#     authors.yml. Nothing else in CITATION.cff changes here (zenodo-doi.yml writes doi, identifiers, version and
#     date-released when a release is published).
#  3. index.md: re-renders the citation quoted under "How to Cite" from CITATION.cff, so the names, year, version
#     and DOI shown to readers always match the citation file.
#
# A push made with the built-in GITHUB_TOKEN starts no other workflows, but none is needed: build.yml and
# deploy-pages.yml expand the pages in their own working copy before building, so the runs started by the
# human's push already render the expanded authors.
#
# Either script exits non-zero when authors.yml itself is wrong (a duplicated or invalid ORCID, an undefined
# affiliation id) or a page credits an author id it does not define; nothing is committed and the hub is not
# told until that is fixed.
#
# Needs the repository secret HUB_DISPATCH_TOKEN: a fine-grained personal access token with Contents read and
# write on the hub repository (the built-in token cannot send events to another repository).

name: Expand page authors
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: expand-page-authors
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml

      - name: Expand page authors, sync CITATION.cff and the landing-page citation, and commit the result
        # In this order: pages first so the citation script reads expanded author entries, and CITATION.cff
        # before index.md so the quote is rendered from the current author list.
        run: |
          python3 .github/scripts/sync-page-authors.py
          python3 .github/scripts/sync-citation.py
          python3 .github/scripts/sync-index-citation.py
          if git diff --quiet; then
            echo "Pages, CITATION.cff and the landing-page citation are all up to date."
            exit 0
          fi
          changed=$(git diff --name-only)
          parts=""
          if [ -n "$(grep -vE '^(CITATION\.cff|index\.md)$' <<<"$changed")" ]; then parts="pages"; fi
          if grep -qx 'CITATION.cff' <<<"$changed"; then parts="${parts:+$parts, }CITATION.cff"; fi
          if grep -qx 'index.md' <<<"$changed"; then parts="${parts:+$parts, }index.md"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync authors and citation from authors.yml ($parts)"
          git push

      - name: Tell the hub to sync
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: gh api repos/dmora127/chtc-biocafe-cookbook/dispatches -f event_type=cookbook-updated
