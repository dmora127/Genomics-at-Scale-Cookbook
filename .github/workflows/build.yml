name: Build cookbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MyST
        run: npm install -g mystmd@1.11.0
      - name: Use the standalone MyST config
        run: cp myst.standalone.yml myst.yml
      - name: Lint page content
        run: bash .github/scripts/lint-content.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml
      - name: Expand page authors from authors.yml
        # Pages may be committed in the short form (`- id:` plus roles). This expands them in the working copy
        # so the build renders full author details; expand-page-authors.yml commits the same expansion to main.
        # Fails when authors.yml is wrong (duplicate or invalid ORCID, undefined affiliation id).
        run: python3 .github/scripts/sync-page-authors.py
      - name: Sync the CITATION.cff author list
        # Rebuilds the list from the pages in the working copy; expand-page-authors.yml commits the same result to
        # main. Fails when a page credits an author id authors.yml does not define or no page credits anyone.
        run: python3 .github/scripts/sync-citation.py
      - name: Build HTML
        run: myst build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}
      - name: Check external links
        run: myst build --html --check-links
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _build/html
